=== football
@narrator Спортзал. Мяч в центре. «Физмат» против «ИнЯза». Виктор Сергеевич поднимает свисток.
@narrator (Это временная версия матча. Настоящий футбол пять на пять появится на этапе 5.)
? Как играть?
* В пас: отдавать Игорю и Денису.
* Самому: обводить всех и бить.
* Сидеть в защите и помогать Бую.

@igor [happy] {shake}ХА-ХА-ХА!{/shake} «ИнЯз» чемпион!
@denis [happy] Как «Барса» в лучшие годы!

=== shower
@narrator Душевые бассейна. Горячей воды — на троих. Желающих — пятеро.
@igor [happy] Кто первый под горячую — тот и прав!
? Что делать?
* Стоять до последнего под горячей водой.
* Уступить и помыться быстро под холодной.
