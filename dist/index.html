=== t5
@opp [norm] Я вчера смотрел спортивный канал. Там один человек бежал быстрее всех.
@roma [norm] И что?
@opp [norm] Это был не я.

=== t6
@opp [norm] Ромчик, я придумал: если молчать долго, тебя начинают бояться.
@roma [norm] Работает?
@opp [norm] Пока только Игорь. Но он пугается всего.

=== t7
@opp [norm] ...
@narrator Заха разминается. Сам не понимает зачем.

=== t8
@opp [norm] У меня голубые глаза. Это просто природа.
@roma [norm] Красиво.
@opp [norm] Мне сказали: «Заха, у тебя глаза как у кота». Я не стал отвечать.

=== t9
@opp [norm] Слушай, ты когда-нибудь чувствовал, что тебя недооценивают?
@roma [norm] Постоянно.
@opp [norm] Тогда мы друзья. Но я не скажу.

=== t10
@opp [norm] Вчера на физре меня поставили в защиту.
@roma [norm] И как?
@opp [norm] Я так грозно стоял, что мяч обошёл по дуге.

=== t11
@opp [norm] Сегодня %dish%. Я ем быстро.
@roma [norm] Почему?
@opp [norm] Чтобы потом ничего не говорить.

=== t12
@opp [norm] Ромчик, у меня просьба: не зови меня «блондином».
@roma [norm] А как?
@opp [norm] «Захар». Или «Заха». Но не «блондин».

=== t13
@opp [norm] Я вчера читал: тишина — признак ума.
@roma [norm] Или лени.
@opp [norm] Это одно и то же. Только лень красивее.

=== t14
@opp [norm] ...
@narrator Заха смотрит на тебя спокойно. В этом взгляде — понимание. Или просто он задумался о еде.

=== t15
@opp [norm] Слушай, у меня есть секрет.
@roma [norm] Какой?
@opp [norm] Я умею свистеть. Но не буду. Это секрет.

=== t16
@opp [norm] Мне вчера дали пять. Я сначала подумал: ошибка.
@roma [norm] Ты же молодец.
@opp [norm] Это были пять рублей. Но всё равно приятно.

=== t17
@opp [norm] Ромчик, ты видишь, как у Игоря растёт грудь?
@roma [norm] Видел.
@opp [norm] Я больше не смотрю. Это слишком громко.

=== t18
@opp [norm] Если честно, я иногда думаю: а что, если слова — это перебор?
@roma [norm] Возможно.
@opp [norm] Вот и я так считаю.

=== t19
@opp [norm] Тут Чер был.
@roma [norm] И что?
@opp [norm] Мы молча поздоровались. Это было как симфония.

=== t20
@opp [norm] Ромчик, хочешь пройтись?
@roma [norm] Куда?
@opp [norm] Никуда. Просто вдвоём. Молча.

@opp [norm] ...
@narrator Заха стоит у стены, в спортивной стойке. Он молчит — как всегда перед матчем.
